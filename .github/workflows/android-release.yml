name: Android APK Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger automatically on version tags (e.g., v1.0.0)
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed for creating GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Update Android Version Code & Name
        run: |
          VERSION_NAME="${{ github.event.inputs.version_tag || github.ref_name }}"
          VERSION_NAME=${VERSION_NAME#v} # Remove 'v' prefix
          VERSION_CODE=${{ github.run_number }}
          
          # Replace default Capacitor versioning in build.gradle
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle
          
      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Extract Tag Name
        id: get_tag
        run: |
          TAG_NAME="${{ github.event.inputs.version_tag || github.ref_name }}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          generate_release_notes: true
          draft: false
          prerelease: false

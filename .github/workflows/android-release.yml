name: Android APK Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger automatically on version tags (e.g., v1.0.0)
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}

    permissions:
      contents: write # Needed for creating GitHub Releases and uploading assets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Build & Versioning
        run: |
          VERSION_NAME="${{ github.event.inputs.version_tag || github.ref_name }}"
          VERSION_NAME=${VERSION_NAME#v}
          [ -z "$VERSION_NAME" ] && VERSION_NAME="1.0.0"
          VERSION_CODE=${{ github.run_number }}
          
          # Set version code and name in build.gradle
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle
          
          # Ensure release build is signed by default
          sed -i 's/minifyEnabled false/minifyEnabled false\n            signingConfig signingConfigs.debug/' android/app/build.gradle || true

      - name: Build Release APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign APK with Custom Keystore (if secret provided)
        if: ${{ env.SIGNING_KEY != '' }}
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Package & Name APK
        id: package_apk
        run: |
          TAG_NAME="${{ github.event.inputs.version_tag || github.ref_name }}"
          TAG_CLEAN=${TAG_NAME#v}
          [ -z "$TAG_CLEAN" ] && TAG_CLEAN="1.0.0"
          APK_NAME="PhonoFlow-v${TAG_CLEAN}.apk"

          mkdir -p output_apk
          if [ -n "${{ steps.sign_apk.outputs.signedReleaseFile }}" ] && [ -f "${{ steps.sign_apk.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" "output_apk/$APK_NAME"
          else
            RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            
            # Ensure APK is signed so devices allow installation
            if [[ "$RAW_APK" == *"unsigned"* ]]; then
              keytool -genkey -v -keystore auto.keystore -alias phonoflow -keyalg RSA -keysize 2048 -validity 10000 -storepass phonoflow -keypass phonoflow -dname "CN=PhonoFlow, O=PhonoFlow, C=US"
              jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore auto.keystore -storepass phonoflow -keypass phonoflow "$RAW_APK" phonoflow
            fi
            
            cp "$RAW_APK" "output_apk/$APK_NAME"
          fi

          echo "apk_path=output_apk/$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${TAG_CLEAN}" >> $GITHUB_ENV

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhonoFlow-APK
          path: ${{ steps.package_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: ${{ steps.package_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false

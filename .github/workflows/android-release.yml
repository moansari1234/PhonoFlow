name: Android APK Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger automatically on version tags (e.g., v1.0.0)
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed for creating GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Update Android Version Code & Name
        run: |
          VERSION_NAME="${{ github.event.inputs.version_tag || github.ref_name }}"
          VERSION_NAME=${VERSION_NAME#v} # Remove 'v' prefix
          VERSION_CODE=${{ github.run_number }}
          
          # Replace default Capacitor versioning in build.gradle
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle

      - name: Build Release APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign APK (if secrets configured)
        if: ${{ env.ANDROID_KEYSTORE != '' }}
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEY }}
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Locate APK File
        id: locate_apk
        run: |
          if [ -n "${{ steps.sign_apk.outputs.signedReleaseFile }}" ] && [ -f "${{ steps.sign_apk.outputs.signedReleaseFile }}" ]; then
            echo "apk_file=${{ steps.sign_apk.outputs.signedReleaseFile }}" >> $GITHUB_OUTPUT
          else
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            echo "apk_file=$APK_PATH" >> $GITHUB_OUTPUT
          fi

      - name: Extract Tag Name
        id: get_tag
        run: |
          TAG_NAME="${{ github.event.inputs.version_tag || github.ref_name }}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: ${{ steps.locate_apk.outputs.apk_file }}
          generate_release_notes: true
          draft: false
          prerelease: false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#047857"/>
    </linearGradient>
    <linearGradient id="waveMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#6ee7b7"/>
      <stop offset="100%" stopColor="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background for Android adaptive maskable icon -->
  <rect width="512" height="512" fill="#0f172a"/>
  
  <!-- Safe zone graphics centered at 256, 256 within 60% diameter circle -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)">
    <!-- Headphones Arc -->
    <path d="M 128 256 A 128 128 0 0 1 384 256" fill="none" stroke="url(#emeraldMaskGrad)" stroke-width="28" stroke-linecap="round"/>
    <!-- Headphone Ear Cups -->
    <rect x="100" y="230" width="48" height="96" rx="24" fill="#10b981"/>
    <rect x="364" y="230" width="48" height="96" rx="24" fill="#10b981"/>
    <rect x="114" y="244" width="20" height="68" rx="10" fill="#064e3b"/>
    <rect x="378" y="244" width="20" height="68" rx="10" fill="#064e3b"/>

    <!-- Soundwave Bars -->
    <g transform="translate(256, 276)">
      <rect x="-72" y="-35" width="12" height="70" rx="6" fill="url(#waveMaskGrad)"/>
      <rect x="-44" y="-60" width="12" height="120" rx="6" fill="url(#waveMaskGrad)"/>
      <rect x="-16" y="-85" width="12" height="170" rx="6" fill="url(#waveMaskGrad)"/>
      <rect x="12" y="-55" width="12" height="110" rx="6" fill="url(#waveMaskGrad)"/>
      <rect x="40" y="-75" width="12" height="150" rx="6" fill="url(#waveMaskGrad)"/>
      <rect x="68" y="-30" width="12" height="60" rx="6" fill="url(#waveMaskGrad)"/>
    </g>
  </g>
</svg>
